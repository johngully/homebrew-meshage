name: Published package lifecycle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: published-package-v0.1.0
  cancel-in-progress: false

jobs:
  bottle-install-upgrade-uninstall:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Download exact published source
        run: |
          curl --fail --location --silent --show-error \
            --output meshage-0.1.0.tar.gz \
            'https://github.com/johngully/homebrew-meshage/releases/download/v0.1.0/meshage-0.1.0.tar.gz?revision=fe6284a6d696d09c6a28c8f92c3b6baa0f72dc6c&asset=canonical-fe6284a'
          tar -xzf meshage-0.1.0.tar.gz

      - name: Set up Go test runner
        uses: actions/setup-go@v6
        with:
          go-version-file: meshage-0.1.0/go.mod
          cache: false

      - name: Run published package lifecycle
        working-directory: meshage-0.1.0
        env:
          MESHAGE_PACKAGE_TEST: "1"
        run: go test ./node_test -run '^TestPublishedStableBottleAndInstalledUpgradeHandoff$' -count=1 -v
